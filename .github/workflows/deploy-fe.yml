name: Deploy DevTinder Frontend to EC2

on:
  push:
    branches:
      - main  # or master
    paths-ignore:
      - '**.md'

jobs:
  deploy:
    if: ${{ startsWith(github.event.head_commit.message, 'deploy:') || startsWith(github.event.head_commit.message, 'DEPLOY:') || startsWith(github.event.head_commit.message, 'Deploy:') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.6.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy Build to EC2 via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*" # or "build/*"
          target: "/tmp/devtinder-fe-build"
          strip_components: 1

      - name: Move Files to /var/www/html & Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/devtinder-fe-build/* /var/www/html/
            sudo rm -rf /tmp/devtinder-fe-build
            sudo systemctl reload nginx